# Cluster-scoped, applied once by a cluster admin (not part of the app overlays):
#   kubectl apply -f infra/k8s/cluster/cluster-issuer.yaml
# Requires cert-manager: https://cert-manager.io/docs/installation/
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: recruiting@kmgtek.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: recruiting@kmgtek.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
      # DNS-01 (wildcard certificates) with Route53:
      # - dns01:
      #     route53:
      #       region: us-east-1
      #     selector:
      #       dnsZones: ["kmgtek.com"]
