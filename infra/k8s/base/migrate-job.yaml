# Pre-deploy database migration (`prisma migrate deploy`).
#
# * Argo CD / Flux: runs automatically as a PreSync hook (annotations below).
# * kubectl: apply the `pre` phase first, wait for completion, then apply the rest:
#     kubectl -n <ns> delete job api-migrate --ignore-not-found
#     kubectl apply -k infra/k8s/overlays/<env> --selector kmg.io/deploy-phase=pre
#     kubectl -n <ns> wait --for=condition=complete job/api-migrate --timeout=10m
#     kubectl apply -k infra/k8s/overlays/<env>
#
# Job specs are immutable — always delete before re-applying with a new image.
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  labels:
    app.kubernetes.io/name: api-migrate
    app.kubernetes.io/component: migration
    kmg.io/deploy-phase: pre
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: kmg
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # same image as the API — the Prisma CLI ships alongside the app
          image: ghcr.io/kmg-technologies/kmg-api:latest
          imagePullPolicy: IfNotPresent
          args: ['migrate']
          env:
            # writable HOME for the Prisma CLI under a read-only root filesystem
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: kmg-config
            - secretRef:
                name: kmg-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
