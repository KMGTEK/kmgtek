# TEMPLATE ONLY — contains no real values and is NOT part of the kustomization.
#
# Recommended (in order):
#   1. External Secrets Operator — sync from AWS Secrets Manager / Vault:
#        kind: ExternalSecret -> target.name: kmg-secrets
#      Secrets never touch git and rotate automatically.
#   2. Sealed Secrets (Bitnami) — commit an encrypted SealedSecret:
#        kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#   3. Last resort, create it imperatively (never commit the result):
#        kubectl -n kmg-production create secret generic kmg-secrets \
#          --from-literal=DATABASE_URL='postgresql://...' \
#          --from-literal=JWT_ACCESS_SECRET="$(openssl rand -base64 48)" ...
#
# Rotating JWT_ACCESS_SECRET invalidates every access token (15 min blast radius);
# refresh tokens are stored hashed in the database and survive.
apiVersion: v1
kind: Secret
metadata:
  name: kmg-secrets
  labels:
    app.kubernetes.io/name: kmg
    kmg.io/deploy-phase: pre
type: Opaque
stringData:
  # ── Database (use PgBouncer or ?connection_limit to cap pool size per pod) ──
  DATABASE_URL: 'postgresql://kmg:CHANGEME@kmg-db.internal:5432/kmg?schema=public&connection_limit=10&pool_timeout=20&sslmode=require'

  # ── Auth ────────────────────────────────────────────────────────────────────
  JWT_ACCESS_SECRET: 'CHANGEME-openssl-rand-base64-48'

  # ── Cache / rate-limit store (ElastiCache, rediss:// for TLS) ───────────────
  REDIS_URL: 'rediss://:CHANGEME@kmg-redis.internal:6379/0'

  # ── Object storage (omit both keys when using IRSA / instance roles) ────────
  S3_ENDPOINT: 'https://s3.us-east-1.amazonaws.com'
  S3_ACCESS_KEY: 'CHANGEME'
  S3_SECRET_KEY: 'CHANGEME'

  # ── Email ───────────────────────────────────────────────────────────────────
  SMTP_HOST: 'email-smtp.us-east-1.amazonaws.com'
  SMTP_USER: 'CHANGEME'
  SMTP_PASS: 'CHANGEME'

  # ── OAuth (optional — social buttons hide when unset) ───────────────────────
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
  LINKEDIN_CLIENT_ID: ''
  LINKEDIN_CLIENT_SECRET: ''

  # ── Seeding (only needed for the one-off seed Job) ──────────────────────────
  SEED_ADMIN_EMAIL: 'admin@kmgtek.com'
  SEED_ADMIN_PASSWORD: 'CHANGEME'
