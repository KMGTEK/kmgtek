apiVersion: v1
kind: ServiceAccount
metadata:
  name: kmg
  labels:
    app.kubernetes.io/name: kmg
    kmg.io/deploy-phase: pre
  # On EKS, bind an IAM role here so the API can reach S3 without static keys
  # (then drop S3_ACCESS_KEY / S3_SECRET_KEY from the Secret):
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/kmg-api
automountServiceAccountToken: false
