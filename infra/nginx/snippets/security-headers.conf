## Fallback security headers for responses whose upstream does NOT set its own:
## nginx-generated responses (429/50x) and objects proxied from the public bucket.
##
## They are deliberately NOT applied to the Next.js or API locations:
##   * apps/web/next.config.ts emits CSP, X-Frame-Options: DENY, Referrer-Policy,
##     Permissions-Policy and HSTS for every route it serves;
##   * the API sets the same family of headers through `helmet`.
## Adding them here too would emit conflicting duplicates (X-Frame-Options DENY
## *and* SAMEORIGIN), which browsers treat as undefined behaviour.
##
## Reminder: `add_header` does not inherit into a location that declares one of
## its own, so this snippet is included per location rather than at server level.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Request-Id $kmg_request_id always;

## HSTS — only meaningful over TLS; enable together with the 443 server block.
## (The Next.js app already sends HSTS in production for the pages it serves.)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
