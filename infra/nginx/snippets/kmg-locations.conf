## KmgTechnologies routing — shared by the HTTP and HTTPS servers.
## Location precedence note: `^~` stops regex evaluation, so /api/ is a plain
## prefix match, letting the job-application regex below take priority.

# ── Next.js immutable build output (hashed filenames) ────────────────────────
location ^~ /_next/static/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://kmg_web;

    proxy_cache            static_cache;
    proxy_cache_valid      200 301 302 7d;
    proxy_cache_lock       on;
    proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# ── Next.js image optimizer (cache keyed on the full query string) ───────────
location ^~ /_next/image {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://kmg_web;

    proxy_cache           static_cache;
    proxy_cache_key       "$scheme$request_method$host$request_uri";
    proxy_cache_valid     200 30d;
    proxy_cache_lock      on;
    add_header X-Cache-Status $upstream_cache_status always;
}

# ── API health probes (unversioned, no /api prefix) ──────────────────────────
location ^~ /health/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://kmg_api;
    access_log off;
    # Restrict to the monitoring network if these should not be public:
    # allow 10.0.0.0/8; deny all;
}

# ── Authentication endpoints — strict brute-force limit ──────────────────────
location ^~ /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_conn perip 20;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://kmg_api;
    proxy_cache off;
}

# ── Contact form — spam limit ────────────────────────────────────────────────
location = /api/v1/contact {
    limit_req zone=forms burst=5 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://kmg_api;
}

# ── Job applications (multipart resume upload) — spam limit + body size ──────
location ~ ^/api/v1/jobs/[^/]+/apply/?$ {
    limit_req zone=forms burst=5 nodelay;
    client_max_body_size 12m;
    client_body_timeout  120s;
    proxy_request_buffering on;
    include /etc/nginx/snippets/proxy.conf;
    proxy_read_timeout 120s;
    proxy_pass http://kmg_api;
}

# ── Everything else under /api (REST v1 + /api/docs Swagger UI) ──────────────
location /api/ {
    limit_req zone=api burst=30 nodelay;
    limit_conn perip 50;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://kmg_api;
    proxy_read_timeout 120s;   # CSV exports and analytics reports
    proxy_cache off;

    # Swagger UI is public by default; restrict it in production if desired:
    # location = /api/docs { allow 10.0.0.0/8; deny all; proxy_pass http://kmg_api; }
}

# ── Public object storage (MinIO bucket `kmg-public`) ────────────────────────
# Optional: lets you publish assets on the site's own domain / CDN.
# Set S3_PUBLIC_URL=https://<domain>/media to use it.
location ^~ /media/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://kmg_s3/kmg-public/;

    proxy_cache        static_cache;
    proxy_cache_valid  200 304 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Cache-Status $upstream_cache_status always;
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
}

# ── Next.js app (SSR / ISR / static pages) ───────────────────────────────────
location / {
    limit_req zone=general burst=60 nodelay;
    limit_conn perip 100;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://kmg_web;
    proxy_cache_bypass $http_upgrade;   # never cache websocket upgrades
}
