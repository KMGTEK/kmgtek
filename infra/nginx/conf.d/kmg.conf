### KmgTechnologies — edge routing
###   /                → web  (Next.js, :3000)
###   /api/            → api  (NestJS, :4000)   — includes /api/docs (Swagger)
###   /health/         → api  health probes
###   /media/          → MinIO public bucket (optional; see docs/DEPLOYMENT.md)
###
### TLS: the port-80 server below serves the app so `docker compose up` works out
### of the box. For production, drop certificates into infra/nginx/certs, then
###   1. uncomment the 443 server at the bottom,
###   2. replace the `include /etc/nginx/snippets/kmg-locations.conf;` in the
###      port-80 server with `return 301 https://$host$request_uri;`
###      (keep the ACME + health locations above it).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security headers are owned by the upstreams (Next.js next.config.ts headers()
    # and helmet in the API); nginx only adds fallbacks where they are missing
    # (see snippets/security-headers.conf), to avoid conflicting duplicates.

    # Container/LB health probe — never rate limited, never logged.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ACME http-01 challenge (certbot writes into this volume).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # --- production: redirect everything else to HTTPS -----------------------
    # return 301 https://$host$request_uri;

    include /etc/nginx/snippets/kmg-locations.conf;
}

