### KmgTechnologies — nginx main configuration (edge proxy in docker-compose.yml)
### Mounted read-only at /etc/nginx/nginx.conf

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 32768;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    ## ── Hardening ────────────────────────────────────────────────────────────
    server_tokens off;

    ## ── Logging (JSON — ready for Loki / CloudWatch / ELK ingestion) ─────────
    log_format json escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"x_forwarded_for":"$http_x_forwarded_for",'
          '"request_id":"$request_id",'
          '"upstream_request_id":"$upstream_http_x_request_id",'
          '"method":"$request_method",'
          '"host":"$host",'
          '"uri":"$uri",'
          '"query":"$query_string",'
          '"status":$status,'
          '"body_bytes":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream":"$upstream_addr",'
          '"upstream_status":"$upstream_status",'
          '"upstream_time":"$upstream_response_time",'
          '"cache":"$upstream_cache_status",'
          '"referer":"$http_referer",'
          '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json;

    ## ── Transport ───────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;
    reset_timedout_connection on;

    ## Uploads: resumes/cover letters are capped at 5 MB each by the API;
    ## 12m leaves room for multipart overhead and a second attachment.
    client_max_body_size      12m;
    client_body_buffer_size   256k;
    client_header_timeout     15s;
    client_body_timeout       30s;
    send_timeout              30s;
    large_client_header_buffers 4 16k;

    ## ── Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml application/manifest+json
        image/svg+xml font/ttf font/otf;

    ## Brotli — the official nginx image has no ngx_brotli module. Use
    ## `nginx:1.28-alpine` + ngx_brotli, or an image such as `fholzer/nginx-brotli`,
    ## then uncomment:
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_static     on;
    # brotli_types      text/plain text/css application/javascript application/json
    #                   application/xml image/svg+xml font/ttf font/otf;

    ## ── Client identity behind a load balancer / CDN ─────────────────────────
    ## Trust only private ranges (the docker bridge and typical VPC CIDRs).
    ## Add the CDN's published ranges (Cloudflare/CloudFront) when one is used.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  fd00::/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    ## ── Websocket / keepalive upgrade handling ──────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';          # empty => reuse the keepalive connection
    }

    ## Forward an incoming request id when present, otherwise mint one.
    map $http_x_request_id $kmg_request_id {
        default $http_x_request_id;
        ''      $request_id;
    }

    ## $scheme as seen by the client (honours an upstream TLS terminator).
    map $http_x_forwarded_proto $kmg_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    ## ── Rate limiting zones (per client IP) ─────────────────────────────────
    ## general : everything on the site
    ## api     : /api/v1/* read traffic
    ## auth    : login/register/refresh/password endpoints — brute-force guard
    ## forms   : contact form + job applications — spam guard
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=20r/m;
    limit_req_zone $binary_remote_addr zone=forms:10m   rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    ## ── Proxy cache for immutable Next.js build assets ──────────────────────
    proxy_cache_path /var/cache/nginx/kmg levels=1:2 keys_zone=static_cache:16m
                     max_size=1g inactive=7d use_temp_path=off;

    ## ── Upstreams (docker DNS; `resolve` keeps them fresh across restarts) ──
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream kmg_web {
        zone kmg_web 64k;
        server web:3000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream kmg_api {
        zone kmg_api 64k;
        server api:4000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream kmg_s3 {
        zone kmg_s3 64k;
        server minio:9000 resolve max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
