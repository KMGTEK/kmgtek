# KmgTechnologies — local development backing services only.
# The apps themselves run on the host with `pnpm dev` (fast refresh, debuggers).
#
#   docker compose -f docker-compose.dev.yml up -d
#   cp .env.example .env && pnpm install && pnpm db:migrate && pnpm db:seed && pnpm dev
#
# Ports are published on localhost so the defaults in .env.example just work:
#   postgres 5432 · redis 6379 · minio 9000 (console 9001) · mailpit 1025 (UI 8025)

name: kmg-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kmg}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kmg}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # console: minioadmin / minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-kmg-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-kmg-private}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set kmg http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "kmg/$$S3_BUCKET_PUBLIC"
        mc mb --ignore-existing "kmg/$$S3_BUCKET_PRIVATE"
        mc anonymous set download "kmg/$$S3_BUCKET_PUBLIC"
        mc anonymous set none "kmg/$$S3_BUCKET_PRIVATE"
        echo "minio-init: buckets ready"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: '5000'
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025' # http://localhost:8025

volumes:
  pg-data:
  redis-data:
  minio-data:
