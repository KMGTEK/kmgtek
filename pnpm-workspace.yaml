packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1133.0'
  - '@aws-sdk/s3-request-presigner@3.1133.0'
  - '@tanstack/query-core@5.103.1'
  - '@tanstack/react-query@5.103.1'
  - '@types/node@22.20.3'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - sharp
  - '@nestjs/core'
  - esbuild
  - unrs-resolver
